<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Both match --bg-primary in tokens.css. When they drift, the phone's
         status bar sits in a slightly different colour from the page under it,
         which reads as a rendering fault rather than a palette choice. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEEFF3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1E2027" />
    <meta name="description" content="Better Me: habits, gym, and finances in one private tracker." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Better Me" />

    <!--
      Preload the two faces that are on screen before first paint: Bold draws
      the one big number or name, Book draws everything else. Creato is still
      the fallback inside the font stack but is no longer preloaded, because
      preloading a face that is not used costs a request and warns in console.
    -->
    <link rel="preload" href="/fonts/RTRondelle-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/RTRondelle-Book.woff2" as="font" type="font/woff2" crossorigin />

    <title>Better Me</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
